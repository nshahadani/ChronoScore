<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>ChronoScore</title>
</head>

<body>
    <header>
        <h1>ChronoScore</h1>
    </header>
    <div class="container">
        <div class="team-card">
            <h3 class="team-title">PLAYER 1</h3>
            <div class="score" id="player1">0</div>
            <div class="buttons">
                <button onclick="addPlayer1(1)">+1</button>
                <button onclick="addPlayer1(2)">+2</button>
                <button onclick="addPlayer1(3)">+3</button>
            </div>
        </div>
        <div class="timer-container">
            <div id="timer-display">60</div>
            <button id="timer-btn" onclick="toggleTimer()">START</button>
        </div>
        <div class="team-card">
            <h3 class="team-title">PLAYER 2</h3>
            <div class="score" id="player2">0</div>
            <div class="buttons">
                <button onclick="addPlayer2(1)">+1</button>
                <button onclick="addPlayer2(2)">+2</button>
                <button onclick="addPlayer2(3)">+3</button>
            </div>
        </div>
    </div>
    <div class="reset-container">
        <button class="reset-button" onclick="resetScores()">Reset Scores</button>
    </div>
</body>
<script src="script.js"></script>

</html>
